<VirtualHost *:80>
    ServerAdmin admin@example.com
    
    ServerName controlcenter.ftx    
    ServerAlias customer.loyalty.ftx
    ServerAlias customer-website.loyalty.ftx
    ServerAlias merchant-website.loyalty.ftx
    ServerAlias merchant.loyalty.ftx
    ServerAlias manufacturer.loyalty.ftx
    ServerAlias order.controlcenter.ftx
    ServerAlias appointments.controlcenter.ftx

	DocumentRoot /var/www/html/public

	<Directory /var/www/html/public>
    	AllowOverride All
    	Require all granted
    	
    	# Security headers
    	Header always set X-Content-Type-Options "nosniff"
    	Header always set X-Frame-Options "SAMEORIGIN"
    	Header always set X-XSS-Protection "1; mode=block"
    	Header always set Referrer-Policy "strict-origin-when-cross-origin"
    	
    	# Disable listing directory contents
    	Options -Indexes
    	
    	# Rewrite rules for Laravel
    	<IfModule mod_rewrite.c>
    		RewriteEngine On
    		RewriteCond %{REQUEST_FILENAME} !-f
    		RewriteCond %{REQUEST_FILENAME} !-d
    		RewriteRule ^ index.php [QSA,L]
    	</IfModule>
	</Directory>

	# Deny access to sensitive files
	<FilesMatch "^\.|\.env|\.git|\.md">
    	Require all denied
	</FilesMatch>

	ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined

	# Compression
	<IfModule mod_deflate.c>
    	AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
	</IfModule>

	# Cache control
	<IfModule mod_expires.c>
    	ExpiresActive On
    	ExpiresByType text/css "access plus 1 year"
    	ExpiresByType text/javascript "access plus 1 year"
    	ExpiresByType application/javascript "access plus 1 year"
    	ExpiresByType image/jpeg "access plus 1 year"
    	ExpiresByType image/png "access plus 1 year"
    	ExpiresByType image/gif "access plus 1 year"
    	ExpiresByType image/svg+xml "access plus 1 year"
	</IfModule>
</VirtualHost>
