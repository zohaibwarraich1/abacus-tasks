<VirtualHost *:80>

    # ==========================================================
    # This VirtualHost handles all incoming requests on port 80
    # (HTTP). Since there's no domain yet, we're setting this up
    # using just the server's IP address.
    # ==========================================================

    # ServerName: tells Apache which hostname/IP this VirtualHost
    # is for. Since there's no domain, put your EC2 public IP here.
    # If this is missing or wrong, Apache will show a startup
    # warning (harmless, but good practice to set correctly).
    ServerName project-abacus-alb-453577078.ap-south-1.elb.amazonaws.com

    # ServerAdmin: just a contact email, sometimes shown on error
    # pages. Not functionally required.
    ServerAdmin raveeddogar10@gmail.com


    # ==========================================================
    # REVERSE PROXY CORE SETTINGS
    # ==========================================================

    # ProxyPreserveHost On: forwards the client's original Host
    # header to the backend (Node app) instead of Apache's own.
    # Needed if your app relies on the Host header for logic like
    # redirects or multi-tenant behavior.
    ProxyPreserveHost On

    # ProxyRequests Off: CRITICAL SECURITY SETTING.
    # This stops Apache from acting as an "open/forward proxy" —
    # meaning random internet users can't abuse your server to
    # relay requests to third-party sites. This should always be
    # Off in a reverse proxy setup.
    ProxyRequests Off

    # ProxyPass: forwards any request coming to "/" (root) to
    # 127.0.0.1:8080 (your Node app). Using 127.0.0.1 instead of
    # "localhost" avoids an unnecessary DNS lookup, slightly faster.
    ProxyPass /node-app-1/ http://127.0.0.1:8080/

    # ProxyPassReverse: if the backend response contains a
    # redirect/Location header, this rewrites it so the client
    # sees the correct (Apache-facing) URL instead of the
    # backend's internal address.
    ProxyPassReverse /node-app-1/ http://127.0.0.1:8080/


    # ==========================================================
    # FORWARDED HEADERS
    # These tell the backend what protocol/port the ORIGINAL
    # client request used — since the connection between Apache
    # and Node is separate from the one between the client and
    # Apache. Useful later if you add SSL: the Node app can still
    # know the original request was HTTPS even though Apache talks
    # to Node over plain HTTP internally.
    # ==========================================================
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"


    # ==========================================================
    # SECURITY HEADERS
    # These headers go out with every response and tell the
    # browser how to behave — protecting against common attacks.
    # ==========================================================

    # Stops the browser from guessing/"sniffing" file types —
    # prevents MIME-type confusion attacks.
    Header always set X-Content-Type-Options "nosniff"

    # Prevents your site from being loaded inside an <iframe> on
    # another site — protects against clickjacking attacks.
    Header always set X-Frame-Options "SAMEORIGIN"

    # Enables older browsers' built-in XSS filter. Largely
    # deprecated in modern browsers, but harmless to keep for
    # legacy support.
    Header always set X-XSS-Protection "1; mode=block"

    # Controls how much referrer information is shared with other
    # sites when a user clicks a link away from your site —
    # improves privacy.
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Removes the "Server" and "X-Powered-By" headers from
    # responses — these normally reveal what software/version
    # you're running. Attackers use this info to target known
    # vulnerabilities for that specific version. Removing it adds
    # a small layer of "security through obscurity."
    Header unset Server
    Header unset X-Powered-By


    # ==========================================================
    # TIMEOUT & SIZE LIMITS
    # Basic protection against abuse, slow clients, and DoS
    # ==========================================================

    # If the backend doesn't respond within 60 seconds, Apache
    # will drop the connection — prevents slow/hanging connections
    # from holding up server resources.
    Timeout 60

    # Maximum allowed request body size — here set to 10 MB
    # (10485760 bytes = 10 * 1024 * 1024). Without a limit, anyone
    # could send a huge payload and exhaust server resources.
    # Increase this if your app needs to handle large file uploads.
    LimitRequestBody 10485760


    # ==========================================================
    # LOGGING
    # ==========================================================

    # Only errors get written here — useful for troubleshooting.
    ErrorLog ${APACHE_LOG_DIR}/node-simple-web-app-http-error.log

    # Logs every request in detail (IP, timestamp, request line,
    # status code, user-agent). "combined" is a standard Apache
    # log format that includes all the common fields.
    CustomLog ${APACHE_LOG_DIR}/node-simple-web-app-http-access.log combined

    # Controls how much detail gets logged. "warn" is a good
    # balance for production — not too noisy, not too quiet. You
    # can temporarily set this to "debug" while troubleshooting,
    # then switch it back to "warn".
    LogLevel warn

</VirtualHost>