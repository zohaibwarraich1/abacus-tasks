<VirtualHost *:80>

    ServerName _default_
    ServerAlias *
    ServerAdmin raveeddogar10@gmail.com

    # Neutral DocumentRoot — na Node, na Laravel ki taraf point
    # kar raha, kyunke dono subpaths pe hain
    DocumentRoot /var/www/html/


    # ==========================================================
    # NODE APP — /node-app-1 subpath pe
    # ==========================================================
    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass /node-app-1/ http://127.0.0.1:8080/
    ProxyPassReverse /node-app-1/ http://127.0.0.1:8080/

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"


    # ==========================================================
    # LARAVEL APP — /laravel-app subpath pe
    # ==========================================================
    Alias /laravel-app /var/www/laravel/public

    <Directory /var/www/laravel/public>
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /laravel-app
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    <DirectoryMatch "^/var/www/laravel/(storage|bootstrap/cache|\.env|\.git)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch \.php$>
        # NOTE: if you have installed PHP 8.4, change the path to php8.4-fpm.sock 
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>

    DirectoryIndex index.php


    # ==========================================================
    # SECURITY HEADERS (common for all apps inside this configuration)
    # ==========================================================
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header unset Server
    Header unset X-Powered-By


    # ==========================================================
    # PERFORMANCE / LIMITS (common for all apps inside this configuration)
    # ==========================================================
    Timeout 120
    LimitRequestBody 20971520

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>


    # ==========================================================
    # LOGGING (common for all apps inside this configuration)
    # ==========================================================
    ErrorLog ${APACHE_LOG_DIR}/multiapp-error.log
    CustomLog ${APACHE_LOG_DIR}/multiapp-access.log combined
    LogLevel warn

</VirtualHost>