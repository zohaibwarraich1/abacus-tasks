<VirtualHost *:80>

    # ==========================================================
    # Basic identification
    # ==========================================================

    # ServerName: the IP or domain this site responds to.
    # No domain? Put your EC2 public IP here.
    ServerName 13.203.160.184

    ServerAdmin raveeddogar10@gmail.com

    # DocumentRoot: for Laravel this must ALWAYS be the public/
    # folder, never the project root — otherwise .env, app/,
    # vendor/ and other sensitive files become directly
    # accessible from the web, which is a major security risk.
    DocumentRoot /var/www/laravel/public


    # Explicitly block sensitive folders — an extra safety layer
    # in case the DocumentRoot ever accidentally points to the
    # project root, or a misconfiguration/symlink exposes these
    <DirectoryMatch "^/var/www/laravel/(storage|bootstrap/cache|\.env|\.git)">
        Require all denied
    </DirectoryMatch>

    # ==========================================================
    # Laravel app subpath pe — Alias use hota hai, ProxyPass nahi
    # ==========================================================

    # Alias: URL path "/laravel-app" ko is filesystem folder se
    # map karta hai. Jab koi /laravel-app/xyz request kare,
    # Apache actual mein /var/www/laravel/public/xyz dhoondega.
    Alias /laravel-app /var/www/laravel/public
    
    <Directory /var/www/laravel/public>
        
        # AllowOverride All: lets Laravel's public/.htaccess file
        # work (needed for URL rewriting — e.g. clean URLs like
        # /login instead of /index.php?route=login)
        AllowOverride All

        # Require all granted: allows access to this directory
        # (Apache 2.4+ syntax, replaces the old "Order allow,deny")
        Require all granted

        # Ye important hai — Laravel ke internal routing
        # (index.php) ko bhi pata hona chahiye ke wo /laravel-app
        # subpath pe hai
        RewriteEngine On
        RewriteBase /laravel-app
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    # ==========================================================
    # PHP-FPM Integration (FastCGI)
    # This is the core piece that connects Apache to PHP-FPM —
    # remember, PHP itself isn't a server; PHP-FPM's worker pool
    # is what actually handles requests
    # ==========================================================
    <FilesMatch \.php$>
        # Tells Apache not to serve .php files itself, but instead
        # forward them to PHP-FPM's Unix socket via the FastCGI
        # protocol. The socket path must match your PHP version
        # (php8.3-fpm.sock).
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Sets index.php as the default index file
    DirectoryIndex index.php


    # ==========================================================
    # Security Headers
    # Sent with every response, protect against common attacks
    # ==========================================================

    # Stops the browser from guessing/sniffing file types —
    # prevents MIME-type confusion attacks
    Header always set X-Content-Type-Options "nosniff"

    # Prevents the site from being loaded inside another site's
    # iframe — protects against clickjacking
    Header always set X-Frame-Options "SAMEORIGIN"

    # Enables older browsers' built-in XSS filter (largely
    # deprecated in modern browsers, harmless to keep)
    Header always set X-XSS-Protection "1; mode=block"

    # Controls how much referrer info gets shared with other
    # sites — improves privacy
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Removes server and PHP version info from responses — stops
    # attackers from targeting known vulnerabilities for that
    # specific version
    Header unset Server
    Header unset X-Powered-By


    # ==========================================================
    # Performance / Abuse Protection
    # ==========================================================

    # If the backend (PHP-FPM) doesn't respond within 120
    # seconds, Apache drops the connection — prevents slow/
    # hanging requests from holding up server resources. Set a
    # bit higher than the usual 60s since some Laravel operations
    # (large exports, reports) can take longer.
    Timeout 120

    # Maximum request body size — 20 MB. Adjust based on your
    # file upload needs.
    LimitRequestBody 20971520

    # Enables compression (if mod_deflate is
    # ==========================================================
    # LOGGING
    # ==========================================================
    ErrorLog ${APACHE_LOG_DIR}/laravel-error.log
    CustomLog ${APACHE_LOG_DIR}/laravel-access.log combined

    LogLevel warn
</VirtualHost>