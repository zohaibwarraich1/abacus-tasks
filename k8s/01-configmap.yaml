apiVersion: v1
kind: ConfigMap
metadata:
  name: laravel-config
  namespace: laravel-adminpanel
data:
  APP_NAME: "Laravel Starter"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://localhost:30000"
  APP_LOCALE: "en"
  APP_FALLBACK_LOCALE: "en"
  APP_LOCALE_PHP: "en_US"
  APP_TIMEZONE: "UTC"
  LOG_CHANNEL: "daily"
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_DATABASE: "homestead"
  DB_USERNAME: "homestead"
  BROADCAST_DRIVER: "log"
  CACHE_DRIVER: "file"
  QUEUE_CONNECTION: "sync"
  SESSION_DRIVER: "file"
  SESSION_LIFETIME: "120"
  MAIL_DRIVER: "log"
  ENABLE_REGISTRATION: "true"
